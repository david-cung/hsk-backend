services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hsk
      POSTGRES_USER: hsk
      POSTGRES_PASSWORD: hsk
    ports:
      - "5432:5432"
    volumes:
      - hsk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsk -d hsk"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://hsk:hsk@postgres:5432/hsk
      JWT_SECRET: ${JWT_SECRET:-dev-hsk-mobile-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-hsk://reset-password}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:8081"]}'
      PUBLIC_API_URL: '${PUBLIC_API_URL:-http://localhost:8000}'
      MEDIA_STORAGE_PROVIDER: '${MEDIA_STORAGE_PROVIDER:-local}'
      MEDIA_STORAGE_DIR: '${MEDIA_STORAGE_DIR:-/tmp/hsk-media}'
      RELEASE: '${RELEASE:-dev}'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hsk_postgres_data:
